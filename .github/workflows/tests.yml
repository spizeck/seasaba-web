name: Website tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical-tests:
    name: Critical website tests
    runs-on: ubuntu-latest
    # Official Playwright container: browsers + system deps pre-installed.
    # Pin to the exact version in package-lock.json; bump both together.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build:test
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: website-test-results
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 14

  performance-budgets:
    name: Performance budgets
    runs-on: ubuntu-latest
    # Same Playwright container: the perf script drives its bundled Chromium.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:test
      # Lab budgets vs the test build: analytics IDs empty + vendors blocked
      # inside the run, so no third-party uptime can flake the gate.
      - run: node scripts/perf-baseline.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: performance-report
          path: perf-report/
          retention-days: 14
